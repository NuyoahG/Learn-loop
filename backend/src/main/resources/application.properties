# ========================================
# Learn loop 后端应用主配置文件
# ========================================

# 应用名称，用于日志、监控等场景标识服务
spring.application.name=learnloop

# 服务监听地址：仅绑定本机回环地址，外部网络无法直接访问（开发环境安全考虑）
server.address=127.0.0.1

# HTTP 服务端口号
server.port=8080

# Actuator 监控端点：仅暴露 health（健康检查），避免信息泄露
management.endpoints.web.exposure.include=health

# 健康检查详情策略：never 表示不向调用方展示内部组件状态明细
management.endpoint.health.show-details=never
# 数据库地址：本机 3306 端口，连接 learnloop 数据库
spring.datasource.url=${LEARNLOOP_DB_URL:jdbc:mysql://127.0.0.1:3306/learnloop?sslMode=REQUIRED&characterEncoding=UTF-8}

# 应用专用账号
spring.datasource.username=${LEARNLOOP_DB_USER:learnloop_app}

# 从启动进程的环境变量读取密码
spring.datasource.password=${LEARNLOOP_DB_PASSWORD}

# MySQL JDBC 驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 将数据库下划线字段映射为 Java 驼峰属性
mybatis.configuration.map-underscore-to-camel-case=true
#静态缓存
spring.web.resources.cache.cachecontrol.no-store=true
# 阶段 3.1A：原件上传。MiB 直接使用字节数，避免单位误解。
# 单文件最大 100 MiB，额外 1 MiB 用于 multipart 开销；TXT/MD 在业务层另限 2 MiB。
spring.servlet.multipart.max-file-size=104857600B
spring.servlet.multipart.max-request-size=105906176B
# 延迟至 MVC 中解析 multipart，使认证/CSRF 仍先检查，并可统一处理超限错误。
spring.servlet.multipart.resolve-lazily=true
# 拒绝大请求后允许容器吞掉剩余有限请求体，避免客户端只得到连接重置。
server.tomcat.max-swallow-size=106954752B
# 原件不是静态资源；使用绝对路径，重建 JAR 不会删除资料。
learnloop.material.storage-root=${LEARNLOOP_MATERIAL_STORAGE_ROOT:${user.home}/.learnloop/materials}

# 阶段 3.1B：内部解析。凭据不进入仓库；Java 可独立启动，解析时才检查配置。
learnloop.material.parse.base-url=${LEARNLOOP_PARSER_URL:http://127.0.0.1:8001}
learnloop.material.parse.service-key=${LEARNLOOP_PARSER_SERVICE_KEY:}
# 单 Java 实例启动时恢复上次中断；测试上下文禁止触碰真实任务。
learnloop.material.parse.recovery-enabled=${LEARNLOOP_PARSE_RECOVERY_ENABLED:true}

# 学习闭环 M1：先执行 stage3_2_learning.sql，再显式启用，旧库启动不自动建表。
learnloop.learning.enabled=${LEARNLOOP_LEARNING_ENABLED:false}
learnloop.learning.worker-enabled=${LEARNLOOP_LEARNING_WORKER_ENABLED:true}
# 正式 Python 内部服务沿用 8001 与解析凭据；8002 仍属于个人实验接口。
learnloop.learning.bkt-base-url=${LEARNLOOP_BKT_BASE_URL:http://127.0.0.1:8001}
learnloop.learning.service-key=${LEARNLOOP_PARSER_SERVICE_KEY:}

# 阶段 3.3：显式点击才提交资料出题任务；需先完成两份增量 SQL 并同时启用 learning。
learnloop.generation.enabled=${LEARNLOOP_GENERATION_ENABLED:false}
learnloop.generation.worker-enabled=${LEARNLOOP_GENERATION_WORKER_ENABLED:true}
learnloop.generation.base-url=${LEARNLOOP_GENERATION_BASE_URL:http://127.0.0.1:8001}
learnloop.generation.service-key=${LEARNLOOP_PARSER_SERVICE_KEY:}

# 阶段 3.4：按登录用户加密保存模型密钥；迁移 SQL 与服务器主密钥配置完成后再开启。
# 不要将主密钥值写在此文件；部署时由本机加密凭据加载脚本注入当前进程环境。
learnloop.model-settings.enabled=${LEARNLOOP_MODEL_SETTINGS_ENABLED:false}
learnloop.model-settings.master-key=${LEARNLOOP_MODEL_MASTER_KEY:}
learnloop.model-settings.model=${LEARNLOOP_MODEL:deepseek-flash}
